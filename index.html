<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Reto del Mes - Senshi-Kan</title>
    <!-- Tailwind CSS para diseño limpio y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para renderizar la gráfica de barras horizontales -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Colores institucionales de la academia */
        .bg-brand-black { background-color: #1a1a1a; }
        .text-brand-gold { color: #d4af37; }
        .bg-brand-gold { background-color: #d4af37; }
        .border-brand-gold { border-color: #d4af37; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Encabezado -->
    <header class="bg-brand-black text-white py-6 shadow-md text-center border-b-4 border-brand-gold">
        <h1 class="text-3xl font-bold tracking-wider text-brand-gold text-center">RETO DEL MES</h1>
        <p class="text-gray-400 text-sm mt-1">Academia de Karate-Do</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- 1. Sección de Selección de Alumno -->
        <section class="bg-white p-6 rounded-lg shadow-md mb-8 border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">¡Bienvenido! Selecciona tu nombre para empezar</h2>
            
            <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <div class="w-full md:w-2/3">
                    <label for="select-alumnos" class="block text-sm font-medium text-gray-700 mb-1">Lista de Alumnos Activos:</label>
                    <select id="select-alumnos" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 bg-gray-50 text-gray-800 text-lg">
                        <option value="">Cargando alumnos del dojo...</option>
                    </select>
                </div>
            </div>

            <!-- Datos del perfil cargado de forma dinámica -->
            <div id="perfil-alumno" class="hidden mt-6 pt-4 border-t border-gray-200 text-center">
                <p class="text-lg text-gray-700">Hola, <span id="lbl-nombre" class="font-bold text-gray-900"></span></p>
                <p class="text-sm text-gray-500">Edad calculada: <span id="lbl-edad" class="font-bold text-gray-800"></span> años (<span id="lbl-categoria" class="font-bold text-amber-600 uppercase"></span>)</p>
            </div>
        </section>

        <!-- 2. Sección de Retos Disponibles -->
        <section class="mb-10">
            <h3 class="text-2xl font-bold text-gray-800 mb-6 border-b-2 border-brand-black pb-2">Retos Disponibles Para Ti</h3>
            
            <!-- Estado de espera -->
            <div id="msg-espera" class="bg-amber-50 border-l-4 border-amber-500 p-4 text-amber-700 rounded rounded-l-none text-center">
                Por favor, selecciona tu nombre arriba para desbloquear tus retos correspondientes.
            </div>

            <!-- Contenedor de Tarjetas de Retos -->
            <div id="contenedor-retos" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                <!-- Las tarjetas se generarán dinámicamente con JavaScript -->
            </div>
        </section>


        <!-- ================= 3. SECCIÓN COLOCADA ABAJO: RESULTADOS DEL MES ================= -->
        <section class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center tracking-wide">RESULTADOS DEL MES</h2>
            
            <!-- Selector de periodo (Mes Actual / Mes Anterior) -->
            <div class="flex justify-center mb-6">
                <div class="inline-flex rounded-md shadow-sm" role="group">
                    <button id="btn-mes-actual" type="button" class="px-5 py-2.5 text-sm font-medium text-white bg-amber-500 rounded-l-lg border border-amber-500 hover:bg-amber-600 focus:z-10 focus:ring-2 focus:ring-amber-500 transition-colors">
                        Mes Actual
                    </button>
                    <button id="btn-mes-anterior" type="button" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white rounded-r-lg border border-gray-200 hover:bg-gray-100 hover:text-amber-600 focus:z-10 focus:ring-2 focus:ring-amber-500 transition-colors">
                        Mes Anterior
                    </button>
                </div>
            </div>

            <!-- Contenedor del lienzo de la gráfica -->
            <div class="relative w-full overflow-x-auto" style="min-height: 380px;">
                <canvas id="graficaPuntajes"></canvas>
            </div>
        </section>

    </main>

    <script>
        // URL oficial e intacta provista para Senshi-Kan
        const API_URL = "https://script.google.com/macros/s/AKfycbxRujWBbv7PpKuuxdr3eJ1wSkBTXqV_Pl1691HmUX4gEcj7SeaYOpmajzd3ivK8Pwr-dg/exec";

        let BD_GLOBAL = { alumnos: [], retos: [], intentosHoy: {}, dashboard: { actual: {}, anterior: {} } };
        let miGraficaInstance = null; 
        let mesFiltroSeleccionado = "actual"; 

        // Al cargar la página, traemos los datos desde tu Web App de Google
        document.addEventListener("DOMContentLoaded", async () => {
            const select = document.getElementById("select-alumnos");
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Error en la comunicación con el script de Google.");
                
                BD_GLOBAL = await response.json();
                
                // ORDENAR ALFABÉTICAMENTE ASCENDENTE (A a la Z) para la lista de selección
                if (BD_GLOBAL.alumnos && BD_GLOBAL.alumnos.length > 0) {
                    BD_GLOBAL.alumnos.sort((a, b) => {
                        return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' });
                    });
                }
                
                // Limpiar y llenar el select de alumnos
                select.innerHTML = '<option value="">-- Selecciona tu Nombre --</option>';
                BD_GLOBAL.alumnos.forEach((alumno, index) => {
                    const option = document.createElement("option");
                    option.value = index; 
                    option.textContent = alumno.nombre;
                    select.appendChild(option);
                });

                // Inicializar y construir la gráfica del mes actual automáticamente con los datos reales
                procesarYConstruirGrafica();

            } catch (error) {
                console.error(error);
                select.innerHTML = '<option value="">Error al cargar alumnos. Avisa a tu Sensei.</option>';
            }
        });

        // Eventos para interactuar con los botones de control de periodos
        document.getElementById("btn-mes-actual").addEventListener("click", function() {
            if (mesFiltroSeleccionado === "actual") return;
            mesFiltroSeleccionado = "actual";
            
            this.className = "px-5 py-2.5 text-sm font-medium text-white bg-amber-500 rounded-l-lg border border-amber-500 focus:z-10";
            document.getElementById("btn-mes-anterior").className = "px-5 py-2.5 text-sm font-medium text-gray-700 bg-white rounded-r-lg border border-gray-200 hover:bg-gray-100 hover:text-amber-600 focus:z-10";
            
            procesarYConstruirGrafica();
        });

        document.getElementById("btn-mes-anterior").addEventListener("click", function() {
            if (mesFiltroSeleccionado === "anterior") return;
            mesFiltroSeleccionado = "anterior";
            
            this.className = "px-5 py-2.5 text-sm font-medium text-white bg-amber-500 rounded-r-lg border border-amber-500 focus:z-10";
            document.getElementById("btn-mes-actual").className = "px-5 py-2.5 text-sm font-medium text-gray-700 bg-white rounded-l-lg border border-gray-200 hover:bg-gray-100 hover:text-amber-600 focus:z-10";
            
            procesarYConstruirGrafica();
        });

        /**
         * SUMATORIA DE PUNTOS REALES DE LA TABLA RETOS Y CONSTRUCCIÓN DE LA GRÁFICA
         */
        function procesarYConstruirGrafica() {
            // Extraer el set de datos correcto enviado desde las sumatorias del backend
            const fuentePuntos = (BD_GLOBAL.dashboard && BD_GLOBAL.dashboard[mesFiltroSeleccionado]) 
                ? BD_GLOBAL.dashboard[mesFiltroSeleccionado] 
                : {};

            const datosOrdenados = [];

            // Aseguramos incluir a todos los alumnos vigentes sumando sus puntos correspondientes
            BD_GLOBAL.alumnos.forEach(alum => {
                const totalPuntosAlumno = fuentePuntos[alum.nombre] || 0;
                datosOrdenados.push({
                    nombre: alum.nombre,
                    puntos: totalPuntosAlumno
                });
            });
            
            // ORDENAR DE MAYOR A MENOR: El alumno con más puntos acumulados aparecerá hasta arriba (Eje Y)
            datosOrdenados.sort((a, b) => b.puntos - a.puntos);

            const listaNombres = datosOrdenados.map(item => item.nombre);
            const listaPuntos = datosOrdenados.map(item => item.puntos);

            // Destruir la gráfica previa si existía para evitar encimamientos visuales
            if (miGraficaInstance) {
                miGraficaInstance.destroy();
            }

            const ctx = document.getElementById('graficaPuntajes').getContext('2d');
            
            // Dibujar gráfica de barras horizontales
            miGraficaInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: listaNombres,
                    datasets: [{
                        label: 'Puntos Acumulados',
                        data: listaPuntos,
                        backgroundColor: '#d4af37', // Amarillo/Oro Institucional
                        borderColor: '#1a1a1a',     // Borde negro sutil
                        borderWidth: 1,
                        barThickness: 16,           
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y', // Fuerza la orientación de las barras horizontales
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.parsed.x} puntos totales`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'PUNTOS ACUMULADOS',
                                font: { weight: 'bold', size: 11 },
                                color: '#4b5563'
                            },
                            grid: { color: '#e5e7eb' }
                        },
                        y: {
                            ticks: {
                                autoSkip: false, // Obliga a listar a todos los alumnos a la izquierda sin omitir renglones
                                font: { size: 11, weight: '600' },
                                color: '#111827'
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Escuchar el cambio de selección de alumno
        document.getElementById("select-alumnos").addEventListener("change", function() {
            const index = this.value;
            const msgEspera = document.getElementById("msg-espera");
            const contenedorRetos = document.getElementById("contenedor-retos");
            const perfil = document.getElementById("perfil-alumno");

            if (index === "") {
                msgEspera.classList.remove("hidden");
                contenedorRetos.classList.add("hidden");
                perfil.classList.add("hidden");
                return;
            }

            // Recuperar datos del alumno seleccionado
            const alumno = BD_GLOBAL.alumnos[index];
            const edad = parsearYCalcularEdad(alumno.fechaNacimiento);
            const categoria = (edad <= 12) ? "infantil" : "juvenil"; 

            // Mostrar perfil en pantalla
            document.getElementById("lbl-nombre").textContent = alumno.nombre;
            document.getElementById("lbl-edad").textContent = isNaN(edad) ? "Error" : edad;
            document.getElementById("lbl-categoria").textContent = categoria;
            perfil.classList.remove("hidden");

            // Filtrar y renderizar los retos activos correspondientes
            filtrarRetos(categoria, alumno.nombre, edad);

            msgEspera.classList.add("hidden");
            contenedorRetos.classList.remove("hidden");
        });

        // Función para procesar las fechas de nacimiento
        function parsearYCalcularEdad(fechaString) {
            if (!fechaString) return NaN;
            let fechaObjeto = new Date(fechaString);

            if (isNaN(fechaObjeto.getTime())) {
                const fechaLimpia = fechaString.split(" ")[0];
                const partes = fechaLimpia.split(/[-/]/);
                
                if (partes.length === 3) {
                    if (partes[0].length === 4) {
                        fechaObjeto = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
                    } else {
                        fechaObjeto = new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
                    }
                }
            }

            if (isNaN(fechaObjeto.getTime())) return NaN;

            const hoy = new Date();
            let edad = hoy.getFullYear() - fechaObjeto.getFullYear();
            const mes = hoy.getMonth() - fechaObjeto.getMonth();
            
            if (mes < 0 || (mes === 0 && hoy.getDate() < fechaObjeto.getDate())) {
                edad--;
            }
            return edad;
        }

        // Función para inyectar los retos vigentes en pantalla
        function filtrarRetos(categoriaAlumno, nombreAlumno, edadAlumno) {
            const contenedor = document.getElementById("contenedor-retos");
            contenedor.innerHTML = ""; 

            const retosFiltrados = BD_GLOBAL.retos.filter(reto => reto.categoria.toLowerCase() === categoriaAlumno);

            if (retosFiltrados.length === 0) {
                contenedor.innerHTML = `<div class="col-span-full text-center py-4 text-gray-500">No hay retos activos para tu categoría este mes.</div>`;
                return;
            }

            retosFiltrados.forEach(reto => {
                const urlDestino = `${reto.url}?nombre=${encodeURIComponent(nombreAlumno)}&edad=${edadAlumno}&reto=${encodeURIComponent(reto.nombre)}`;
                const numEstrellas = reto.popularidad || 1;
                const estrellasHtml = "⭐".repeat(numEstrellas);

                const llaveCombinada = `${nombreAlumno}_${reto.nombre}`;
                const hechosHoy = BD_GLOBAL.intentosHoy[llaveCombinada] || 0;
                const limiteMaximo = reto.limiteDiario;
                
                const yaLlegoAlLimite = hechosHoy >= limiteMaximo;

                let botonHtml = "";
                if (yaLlegoAlLimite) {
                    botonHtml = `
                        <button disabled class="w-full text-center bg-gray-300 text-gray-500 font-bold py-3 px-4 rounded cursor-not-allowed uppercase text-sm tracking-wide border border-gray-400">
                            Límite Diario Alcanzado
                        </button>
                    `;
                } else {
                    botonHtml = `
                        <a href="${urlDestino}" class="block text-center bg-brand-black text-brand-gold font-bold py-3 px-4 rounded hover:bg-gray-800 transition-colors tracking-wide border border-brand-gold">
                            INICIAR RETO
                        </a>
                    `;
                }

                const infoIntentos = (limiteMaximo < 999) 
                    ? `<p class="text-xs font-semibold mt-2 ${yaLlegoAlLimite ? 'text-red-600' : 'text-gray-500'}">Realizados hoy: ${hechosHoy} de ${limiteMaximo} permitidos</p>`
                    : '';

                const tarjeta = document.createElement("div");
                tarjeta.className = "relative bg-white border-2 border-gray-200 rounded-lg p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between";
                tarjeta.innerHTML = `
                    <div class="absolute top-3 right-3 text-sm select-none" title="Popularidad: ${numEstrellas} de 5">
                        ${estrellasHtml}
                    </div>
                    <div>
                        <span class="inline-block text-xs font-semibold px-2 py-1 rounded bg-amber-100 text-amber-800 uppercase mb-2">${reto.categoria}</span>
                        <h4 class="text-xl font-bold text-gray-800 mb-2 pr-16">${reto.nombre}</h4>
                        <p class="text-sm text-gray-600 mb-4">Completa esta actividad en casa para seguir acumulando puntos este mes.</p>
                    </div>
                    <div>
                        ${botonHtml}
                        ${infoIntentos}
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }
    </script>
</body>
</html>
