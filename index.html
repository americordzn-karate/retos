<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Reto del Mes - Senshi-Kan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-brand-black { background-color: #1a1a1a; }
        .text-brand-gold { color: #d4af37; }
        .bg-brand-gold { background-color: #d4af37; }
        .border-brand-gold { border-color: #d4af37; }
        .sugerencias-lista {
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <header class="bg-brand-black text-white py-6 shadow-md text-center border-b-4 border-brand-gold">
        <h1 class="text-3xl font-bold tracking-wider text-brand-gold text-center">RETO DEL MES</h1>
        <p class="text-gray-400 text-sm mt-1">Academia de Karate-Do</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <section class="bg-white rounded-lg p-6 shadow-md mb-8 border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span>🥋</span> Identificación del Alumno
            </h2>
            <div class="relative">
                <label for="buscar-alumno" class="block text-sm font-medium text-gray-700 mb-1">Escribe tu nombre completo:</label>
                <input type="text" id="buscar-alumno" placeholder="Ej. Juan Pérez..." class="w-full border-2 border-gray-300 rounded px-4 py-2 text-lg focus:outline-none focus:border-brand-black transition-colors" autocomplete="off">
                <div id="sugerencias" class="absolute left-0 right-0 bg-white border border-gray-300 rounded mt-1 shadow-lg hidden sugerencias-lista"></div>
            </div>

            <div id="perfil-sesion" class="mt-4 p-4 bg-amber-50 border border-amber-200 rounded hidden flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <p class="text-xs font-semibold text-amber-700 uppercase tracking-wider">Sesión Activa</p>
                    <h3 id="sesion-nombre" class="text-lg font-bold text-gray-900"></h3>
                    <p id="sesion-detalles" class="text-sm text-gray-600"></p>
                </div>
                <button id="btn-cerrar-sesion" class="text-sm bg-red-100 hover:bg-red-200 text-red-700 font-medium py-1 px-3 rounded transition-colors">
                    Cambiar de Alumno
                </button>
            </div>
        </section>

        <section>
            <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                <span>🏆</span> Retos Disponibles para Ti
            </h2>
            <div id="contenedor-retos" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <p id="mensaje-retos" class="text-gray-500 italic col-span-full text-center py-8 bg-white rounded border border-dashed border-gray-300">
                    Por favor, selecciona tu nombre arriba para visualizar los retos y tus intentos disponibles.
                </p>
            </div>
        </section>
    </main>

    <script>
        // CONFIGURACIÓN PRINCIPAL: Reemplaza con la URL de tu Web App de Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-HblajsORhiS0C6ZbJ-RsooJVE2uWMEE6mB4Miag7-7slpusjkAgyS51gyRU_xcsseg/exec";

        let BD_ALUMNOS = [];
        let BD_RETOS = [];
        let BD_LOGS = [];
        let alumnoSeleccionado = null;

        document.addEventListener("DOMContentLoaded", () => {
            inicializarElementos();
            cargarDatosDesdeServidor();
            verificarSesionExistente();
        });

        function inicializarElementos() {
            const inputBuscar = document.getElementById("buscar-alumno");
            const btnCerrar = document.getElementById("btn-cerrar-sesion");

            inputBuscar.addEventListener("input", manejarEscrituraBusqueda);
            inputBuscar.addEventListener("focus", () => { if(inputBuscar.value.trim().length >= 2) mostrarSugerencias(); });
            
            // Cerrar sugerencias al hacer clic fuera
            document.addEventListener("click", (e) => {
                if (e.target !== inputBuscar && !document.getElementById("sugerencias").contains(e.target)) {
                    ocultarSugerencias();
                }
            });

            btnCerrar.addEventListener("click", cerrarSesionAlumno);
        }

        async function cargarDatosDesdeServidor() {
            try {
                const respuesta = await fetch(WEB_APP_URL);
                const datos = await respuesta.json();
                
                if (datos && datos.alumnos && datos.catalogoRetos) {
                    BD_ALUMNOS = datos.alumnos;
                    BD_RETOS = datos.catalogoRetos;
                    BD_LOGS = datos.resultadosLog || [];
                    
                    // Si ya había una sesión guardada, refrescar los retos con los datos nuevos
                    if (alumnoSeleccionado) {
                        // Actualizar objeto por si cambiaron datos en la hoja
                        alumnoSeleccionado = BD_ALUMNOS.find(a => a.nombre === alumnoSeleccionado.nombre) || alumnoSeleccionado;
                        renderizarRetos();
                    }
                }
            } catch (error) {
                console.error("Error al conectar con el backend:", error);
            }
        }

        function verificarSesionExistente() {
            const sesionGuardada = localStorage.getItem("karate_alumno_sesion");
            if (sesionGuardada) {
                alumnoSeleccionado = JSON.parse(sesionGuardada);
                mostrarPerfilSesion();
            }
        }

        function manejarEscrituraBusqueda(e) {
            const texto = e.target.value.trim().toLowerCase();
            const divSugerencias = document.getElementById("sugerencias");

            if (texto.length < 2) {
                ocultarSugerencias();
                return;
            }

            // Filtrar alumnos vigentes
            const filtrados = BD_ALUMNOS.filter(alumno => 
                alumno.nombre.toLowerCase().includes(texto)
            );

            if (filtrados.length === 0) {
                divSugerencias.innerHTML = `<div class="p-3 text-sm text-gray-500 italic">No se encontraron alumnos vigentes con ese nombre</div>`;
            } else {
                divSugerencias.innerHTML = filtrados.map(alumno => `
                    <div class="p-3 text-base text-gray-800 hover:bg-amber-100 cursor-pointer border-b border-gray-100 font-medium" 
                         onclick="seleccionarAlumno('${alumno.nombre.replace(/'/g, "\\'")}')">
                        ${alumno.nombre}
                    </div>
                `).join("");
            }
            mostrarSugerencias();
        }

        function mostrarSugerencias() { document.getElementById("sugerencias").classList.remove("hidden"); }
        function ocultarSugerencias() { document.getElementById("sugerencias").classList.add("hidden"); }

        function seleccionarAlumno(nombre) {
            const alumno = BD_ALUMNOS.find(a => a.nombre === nombre);
            if (!alumno) return;

            alumnoSeleccionado = alumno;
            localStorage.setItem("karate_alumno_sesion", JSON.stringify(alumno));
            
            document.getElementById("buscar-alumno").value = "";
            ocultarSugerencias();
            mostrarPerfilSesion();
            renderizarRetos();
        }

        function mostrarPerfilSesion() {
            document.getElementById("buscar-alumno").parentElement.classList.add("hidden");
            document.getElementById("sesion-nombre").textContent = alumnoSeleccionado.nombre;
            
            const edad = alumnoSeleccionado.fecha_nacimiento ? calcularEdad(alumnoSeleccionado.fecha_nacimiento) + " años" : "N/D";
            document.getElementById("sesion-detalles").textContent = `Estatura: ${alumnoSeleccionado.estatura_cm || 'N/D'} cm | Peso: ${alumnoSeleccionado.peso_kg || 'N/D'} kg | Edad: ${edad}`;
            document.getElementById("perfil-sesion").classList.remove("hidden");
        }

        function cerrarSesionAlumno() {
            alumnoSeleccionado = null;
            localStorage.removeItem("karate_alumno_sesion");
            
            document.getElementById("perfil-sesion").classList.add("hidden");
            document.getElementById("buscar-alumno").parentElement.classList.remove("hidden");
            
            const contenedorRetos = document.getElementById("contenedor-retos");
            contenedorRetos.innerHTML = `
                <p id="mensaje-retos" class="text-gray-500 italic col-span-full text-center py-8 bg-white rounded border border-dashed border-gray-300">
                    Por favor, selecciona tu nombre arriba para visualizar los retos y tus intentos disponibles.
                </p>
            `;
        }

        function renderizarRetos() {
            const contenedorRetos = document.getElementById("contenedor-retos");
            contenedorRetos.innerHTML = "";

            if (BD_RETOS.length === 0) {
                contenedorRetos.innerHTML = `<p class="text-gray-500 italic col-span-full text-center py-4">No hay retos configurados en el catálogo actualmente.</p>`;
                return;
            }

            const hoyString = obtenerFechaActualLocalString();

            BD_RETOS.forEach(reto => {
                // Calcular intentos realizados hoy para este reto específico por este alumno
                const realizadosHoy = BD_LOGS.filter(log => {
                    if (!log.fecha_reto || !log.nombre_alumno || !log.nombre_reto) return false;
                    const esMismoAlumno = log.nombre_alumno.trim().toLowerCase() === alumnoSeleccionado.nombre.trim().toLowerCase();
                    const esMismoReto = log.nombre_reto.trim().toLowerCase() === reto.nombre.trim().toLowerCase();
                    const esHoy = log.fecha_reto.split("T")[0] === hoyString;
                    return esMismoAlumno && esMismoReto && esHoy;
                }).length;

                const limiteMaximo = parseInt(reto.limite_intentos_diarios) || 999;
                const tieneIntentosDisponibles = realizadosHoy < limiteMaximo;

                // Estrellas de dificultad
                const dificultad = parseInt(reto.dificultad) || 1;
                let estrellasHTML = "";
                for (let i = 1; i <= 5; i++) {
                    estrellasHTML += `<span class="${i <= dificultad ? 'text-amber-400' : 'text-gray-300'} text-lg">★</span>`;
                }

                // Generar URL destino pasando los parámetros dinámicos del alumno y reto
                const urlDestino = `${reto.url_app_web}?alumno=${encodeURIComponent(alumnoSeleccionado.nombre)}&estatura=${encodeURIComponent(alumnoSeleccionado.estatura_cm || "")}&peso=${encodeURIComponent(alumnoSeleccionado.peso_kg || "")}&reto=${encodeURIComponent(reto.nombre)}`;

                let botonHTML = "";
                if (!tieneIntentosDisponibles) {
                    botonHTML = `<button disabled class="w-full text-center bg-gray-300 text-gray-500 font-bold py-3 px-4 rounded tracking-wide cursor-not-allowed uppercase">Límite Diario Alcanzado</button>`;
                } else {
                    botonHTML = `<a href="${urlDestino}" class="block text-center bg-brand-black text-brand-gold hover:bg-neutral-800 font-bold py-3 px-4 rounded tracking-wide border border-brand-gold transition-colors">INICIAR RETO</a>`;
                }

                const tarjeta = document.createElement("div");
                tarjeta.className = "bg-white border-2 border-gray-200 rounded-lg p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between";
                tarjeta.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block text-xs font-semibold px-2 py-1 rounded bg-amber-100 text-amber-800 uppercase">${reto.categoria || "General"}</span>
                            <div class="flex items-center gap-0.5">${estrellasHTML}</div>
                        </div>
                        <h4 class="text-xl font-bold text-gray-800 mb-2">${reto.nombre}</h4>
                        <p class="text-sm text-gray-600 mb-1">Completa las actividades para sumar puntos.</p>
                        <p class="text-xs font-semibold text-neutral-500 mb-4 tracking-wide">Intentos hoy: <span class="font-bold text-brand-black">${realizadosHoy}</span> de ${limiteMaximo === 999 ? 'Sin límite' : limiteMaximo}</p>
                    </div>
                    ${botonHTML}
                `;
                contenedorRetos.appendChild(tarjeta);
            });
        }

        function calcularEdad(fechaString) {
            if(!fechaString) return "";
            const fechaNac = new Date(fechaString);
            if (isNaN(fechaNac.getTime())) return "";
            const dif = Date.now() - fechaNac.getTime();
            const edadFecha = new Date(dif);
            return Math.abs(edadFecha.getUTCFullYear() - 1970);
        }

        function obtenerFechaActualLocalString() {
            const d = new Date();
            const offset = d.getTimezoneOffset();
            const local = new Date(d.getTime() - (offset * 60 * 1000));
            return local.toISOString().split('T')[0];
        }
    </script>
</body>
</html>
