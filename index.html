<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto del Mes - Senshi-Kan Karate Academy</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
    }
    .text-gold {
      color: #D4AF37;
    }
    .bg-gold {
      background-color: #D4AF37;
    }
    .border-gold {
      border-color: #D4AF37;
    }
    .border-zinc-custom {
      border-color: #27272a;
    }
    .bg-zinc-custom {
      background-color: #09090b;
    }
    .bg-card-custom {
      background-color: #141416;
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-between">

  <!-- ENCABEZADO OFICIAL SENSHI-KAN -->
  <header class="border-b border-zinc-custom bg-zinc-custom p-6 text-center">
    <h1 class="text-3xl font-black uppercase tracking-wider text-white">
      SENSHI-KAN <span class="text-gold">KARATE ACADEMY</span>
    </h1>
    <p class="text-zinc-400 text-xs tracking-widest uppercase mt-1">Portal del Alumno &bull; Reto del Mes</p>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-7xl mx-auto p-4 md:p-8 w-full flex-grow space-y-8">
    
    <!-- ESTADO DE CARGA -->
    <div id="estado-carga" class="text-center p-12 bg-card-custom rounded border border-zinc-custom">
      <p class="text-zinc-400 text-sm tracking-wide animate-pulse uppercase">Sincronizando registros con el Dojo...</p>
    </div>

    <!-- SECCIONES DEL PORTAL -->
    <div id="contenido-portal" class="hidden space-y-8">
      
      <!-- CONTENEDOR SUPERIOR: GRÁFICA Y LISTADO -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- GRÁFICA DE RENDIMIENTO -->
        <div class="lg:col-span-2 bg-card-custom p-6 rounded border border-zinc-custom flex flex-col justify-between">
          <div class="border-b border-zinc-custom pb-3 mb-4">
            <h2 class="text-lg font-black uppercase tracking-wide text-white">Rendimiento Mensual</h2>
          </div>
          <div class="relative w-full h-72">
            <canvas id="graficaPuntajes"></canvas>
          </div>
        </div>

        <!-- LISTA DE ALUMNOS ACTIVOS CON BIOMETRÍA -->
        <div class="bg-card-custom p-6 rounded border border-zinc-custom flex flex-col">
          <div class="border-b border-zinc-custom pb-3 mb-4">
            <h2 class="text-lg font-black uppercase tracking-wide text-gold">Alumnos Activos</h2>
          </div>
          <div id="lista-alumnos" class="overflow-y-auto max-h-72 space-y-3 pr-2 flex-grow">
            <!-- Inyección dinámica -->
          </div>
        </div>

      </div>

      <!-- SECCIÓN INFERIOR: TARJETAS DE RETOS -->
      <div class="space-y-4">
        <div class="border-b border-zinc-custom pb-2">
          <h2 class="text-xl font-black uppercase tracking-wide text-white">Módulos de Retos</h2>
        </div>
        <div id="cuadrícula-retos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Inyección dinámica -->
        </div>
      </div>

    </div>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="text-center p-6 text-zinc-600 text-[10px] tracking-wider uppercase border-t border-zinc-custom bg-zinc-custom mt-12">
    &copy; 2026 Senshi-Kan Karate Academy &bull; Reynosa, Tamaulipas &bull; Sports Science & Technology Integration
  </footer>

  <!-- CONTROL DE INTERFAZ -->
  <script>
    let datosDojo = { alumnos: [], retos: [], dashboard: { actual: {} } };
    let miGrafica = null;

    // URL DEL COMPILADO EN APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySqffvaPMOgzpdoscNAlSoUaEJGC_cTmaFG3VKmRNcKbbJ2ui_RRnRxNJTCQE2hAIXrQ/exec";

    window.addEventListener('DOMContentLoaded', iniciarPortal);

    async function iniciarPortal() {
      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error("Fallo en la comunicación con la API.");
        
        datosDojo = await response.json();
        
        document.getElementById('estado-carga').classList.add('hidden');
        document.getElementById('contenido-portal').classList.remove('hidden');

        renderizarAlumnos();
        renderizarRetos();
        inicializarGrafica();

      } catch (error) {
        console.error("Error al cargar interfaz:", error);
        document.getElementById('estado-carga').innerHTML = `
          <p class="text-red-500 font-bold uppercase text-xs tracking-wider">Error de enlace con la base de datos.</p>
        `;
      }
    }

    function renderizarAlumnos() {
      const contenedor = document.getElementById('lista-alumnos');
      contenedor.innerHTML = "";

      if (!datosDojo.alumnos || datosDojo.alumnos.length === 0) {
        contenedor.innerHTML = `<p class="text-zinc-600 text-xs uppercase p-2">Sin alumnos activos.</p>`;
        return;
      }

      datosDojo.alumnos.forEach(alumno => {
        const div = document.createElement('div');
        div.className = "p-3 bg-black rounded border border-zinc-custom hover:border-gold transition-colors duration-150";
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm text-zinc-200">${alumno.nombre}</span>
            <span class="text-[10px] bg-zinc-900 text-zinc-500 px-2 py-0.5 rounded border border-zinc-800">ID: ${alumno.id}</span>
          </div>
          <div class="flex gap-4 mt-2 text-[11px] text-zinc-500">
            <span>Estatura: <strong class="text-zinc-300">${alumno.estatura}</strong></span>
            <span>Peso: <strong class="text-zinc-300">${alumno.peso}</strong></span>
          </div>
        `;
        contenedor.appendChild(div);
      });
    }

    function renderizarRetos() {
      const contenedor = document.getElementById('cuadrícula-retos');
      contenedor.innerHTML = "";

      if (!datosDojo.retos || datosDojo.retos.length === 0) {
        contenedor.innerHTML = `<p class="text-zinc-600 text-xs uppercase text-center py-6">No hay retos registrados.</p>`;
        return;
      }

      datosDojo.retos.forEach(reto => {
        const tarjeta = document.createElement('div');
        tarjeta.className = "bg-card-custom border border-zinc-custom rounded p-5 flex flex-col justify-between hover:border-zinc-700 transition-colors duration-200";
        tarjeta.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <h3 class="font-bold text-base text-white tracking-wide uppercase">${reto.nombre}</h3>
              <span class="text-[9px] tracking-wider px-2 py-0.5 rounded bg-amber-400/10 text-gold border border-amber-400/20 font-bold uppercase">${reto.categoria}</span>
            </div>
            <p class="text-zinc-500 text-xs">Límite Diario: <span class="text-zinc-300 font-medium">${reto.limiteDiario}</span></p>
          </div>
          <div class="mt-6 pt-4 border-t border-zinc-800 flex justify-between items-center">
            <span class="text-[11px] text-zinc-600">Popularidad: ${reto.popularidad || 0}★</span>
            <a href="${reto.url}" target="_blank" class="text-[10px] font-bold uppercase tracking-widest bg-white text-black px-4 py-2 rounded hover:bg-gold hover:text-black transition-colors duration-150">Ver Guía</a>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    function inicializarGrafica() {
      const ctx = document.getElementById('graficaPuntajes').getContext('2d');
      
      const nombresAlumnos = Object.keys(datosDojo.dashboard.actual);
      const puntajesTotales = Object.values(datosDojo.dashboard.actual);

      if (miGrafica) {
        miGrafica.destroy();
      }

      miGrafica = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: nombresAlumnos.length > 0 ? nombresAlumnos : ["Sin Datos"],
          datasets: [{
            data: puntajesTotales.length > 0 ? puntajesTotales : [0],
            backgroundColor: '#D4AF37', 
            borderColor: '#FFFFFF',
            borderWidth: 0,
            borderRadius: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#09090b',
              titleColor: '#D4AF37',
              bodyColor: '#ffffff',
              borderColor: '#27272a',
              borderWidth: 1,
              cornerRadius: 2
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: '#18181b' },
              ticks: { color: '#71717a', font: { size: 10 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#a1a1aa', font: { size: 10, weight: '600' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
