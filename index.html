<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senshi-Kan - Reto del Mes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
        }
        .mustard-text { color: #e5a93c; }
        .mustard-bg { background-color: #e5a93c; }
        .mustard-border { border-color: #e5a93c; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8 border-b-2 mustard-border pb-4">
            <h1 class="text-4xl font-bold tracking-widest">SENSHI-KAN KARATE DO</h1>
            <p class="text-xl mt-2 font-semibold tracking-wider text-gray-300">RETO DEL MES</p>
        </header>

        <div id="loading" class="text-center text-xl my-12 mustard-text animate-pulse">
            CONECTANDO CON EL DOJO...
        </div>

        <div id="main-container" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                
                <!-- Selector de Alumnos -->
                <div class="bg-[#111111] p-4 rounded border mustard-border">
                    <h2 class="text-lg font-bold mb-3 uppercase tracking-wider text-center">Seleccionar Alumno</h2>
                    <select id="alumno-select" class="w-full bg-[#222222] text-white p-2 border border-gray-600 rounded focus:outline-none focus:border-[#e5a93c]">
                        <option value="">-- Elige un alumno --</option>
                    </select>

                    <div id="info-alumno" class="hidden mt-6 pt-4 border-t border-gray-700">
                        <p class="text-xs text-gray-400">Alumno activo:</p>
                        <p id="info-nombre" class="text-xl font-bold mustard-text uppercase mt-1"></p>
                        <p id="info-cat" class="text-sm font-semibold tracking-wide uppercase mt-1 text-gray-300"></p>
                    </div>
                </div>

                <!-- Panel de Retos -->
                <div class="md:col-span-2 bg-[#111111] p-4 rounded border border-gray-800">
                    <h2 class="text-lg font-bold mb-3 uppercase tracking-wider text-center text-gray-200">Panel de Entrenamiento</h2>
                    
                    <div id="placeholder-retos" class="text-center py-12 text-gray-500 italic text-sm">
                        Por favor, selecciona tu nombre para visualizar los retos asignados.
                    </div>

                    <div id="retos-container" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Tarjetas dinámicas -->
                    </div>
                </div>
            </div>

            <!-- Gráfica de Rendimiento -->
            <div class="bg-[#111111] p-4 rounded border border-gray-800">
                <h2 class="text-lg font-bold mb-4 uppercase tracking-wider text-center mustard-text">Tabla General de Rendimiento</h2>
                <div class="relative h-[350px]">
                    <canvas id="chart-rendimiento"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyDB0Ynik_VWbOnboJE6ix9Xm1VRVMx1V1UoMREiHkCaBfOAWcOpJvfQN1I1y9WO8UqSQ/exec";

        // Estructura base de respaldo
        let datosDojo = { alumnos: [], retos: [], intentosHoy: {}, dashboard: { actual: {}, anterior: {} } };
        let listaAlumnosProcesada = [];
        let graficoRendimiento = null;

        window.addEventListener("load", iniciarPortal);

        async function iniciarPortal() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Error en la conexión de red");
                
                const jsonRecibido = await response.json();
                console.log("Datos crudos recibidos del Sheets:", jsonRecibido);

                // CONTROL DE ROBUSTEZ: Detecta la ubicación real de la lista de alumnos sin importar la propiedad
                if (Array.isArray(jsonRecibido)) {
                    listaAlumnosProcesada = jsonRecibido;
                } else if (jsonRecibido.alumnos && Array.isArray(jsonRecibido.alumnos)) {
                    datosDojo = jsonRecibido;
                    listaAlumnosProcesada = jsonRecibido.alumnos;
                } else if (jsonRecibido.datos && Array.isArray(jsonRecibido.datos)) {
                    listaAlumnosProcesada = jsonRecibido.datos;
                    datosDojo = jsonRecibido;
                } else {
                    // Fallback por si los datos vienen en otra propiedad del objeto raíz
                    for (let clave in jsonRecibido) {
                        if (Array.isArray(jsonRecibido[clave])) {
                            listaAlumnosProcesada = jsonRecibido[clave];
                            datosDojo = jsonRecibido;
                            break;
                        }
                    }
                }

                document.getElementById("loading").classList.add("hidden");
                document.getElementById("main-container").classList.remove("hidden");

                cargarListaAlumnos();
                construirGrafica();
            } catch (err) {
                console.error("Error al iniciar el portal:", err);
                document.getElementById("loading").textContent = "⚠️ ERROR AL CARGAR LOS DATOS. REINTENTA MÁS TARDE.";
            }
        }

        function cargarListaAlumnos() {
            const select = document.getElementById("alumno-select");
            
            if (!listaAlumnosProcesada || listaAlumnosProcesada.length === 0) {
                console.warn("No se encontraron alumnos en la estructura del JSON.");
                const optError = document.createElement("option");
                optError.textContent = "Error: Sin alumnos en base de datos";
                select.appendChild(optError);
                return;
            }

            // Ordenamiento alfabético por nombre seguro
            listaAlumnosProcesada.sort((a, b) => {
                const nameA = a.nombre || a.Nombre || "";
                const nameB = b.nombre || b.Nombre || "";
                return nameA.localeCompare(nameB);
            });
            
            listaAlumnosProcesada.forEach(al => {
                // Validación para aceptar 'id' o 'ID', y 'nombre' o 'Nombre'
                const idFinal = al.id || al.ID || al.idAlumno;
                const nombreFinal = al.nombre || al.Nombre;
                
                if (nombreFinal) {
                    const opt = document.createElement("option");
                    opt.value = idFinal;
                    opt.textContent = nombreFinal;
                    select.appendChild(opt);
                }
            });

            select.addEventListener("change", seleccionarAlumno);
        }

        function seleccionarAlumno(e) {
            const idAl = e.target.value;
            const placeholder = document.getElementById("placeholder-retos");
            const contenedor = document.getElementById("retos-container");
            const info = document.getElementById("info-alumno");

            if (!idAl) {
                placeholder.classList.remove("hidden");
                contenedor.classList.add("hidden");
                info.classList.add("hidden");
                return;
            }

            const alumno = listaAlumnosProcesada.find(a => (a.id || a.ID || a.idAlumno) === idAl);
            const fechaNac = alumno.fechaNacimiento || alumno.FechaNacimiento || alumno.fecha;
            const cat = obtenerCategoriaPorEdad(fechaNac);

            document.getElementById("info-nombre").textContent = alumno.nombre || alumno.Nombre;
            document.getElementById("info-cat").textContent = `Categoría: ${cat}`;
            info.classList.remove("hidden");

            desplegarRetosFiltrados(alumno.nombre || alumno.Nombre, cat);
            
            placeholder.classList.add("hidden");
            contenedor.classList.remove("hidden");
        }

        function obtenerCategoriaPorEdad(fechaNacStr) {
            if (!fechaNacStr) return "infantil";
            try {
                const nac = new Date(fechaNacStr);
                if (isNaN(nac.getTime())) return "infantil";
                const hoy = new Date();
                let edad = hoy.getFullYear() - nac.getFullYear();
                const m = hoy.getMonth() - nac.getMonth();
                if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) {
                    edad--;
                }
                return (edad >= 13) ? "juvenil" : "infantil";
            } catch (e) {
                return "infantil";
            }
        }

        function desplegarRetosFiltrados(nombreAl, catAl) {
            const contenedor = document.getElementById("retos-container");
            contenedor.innerHTML = "";

            const listaRetos = datosDojo.retos || [];
            const filtrados = listaRetos.filter(r => {
                const categoriaReto = r.categoria || r.Categoria || "";
                const rCat = categoriaReto.toLowerCase().trim();
                return rCat === "todas" || rCat === catAl.toLowerCase().trim();
            });

            if (filtrados.length === 0) {
                contenedor.innerHTML = `<p class="col-span-2 text-center text-gray-500 py-6">No hay retos para tu categoría.</p>`;
                return;
            }

            filtrados.forEach(r => {
                const rNombre = r.nombre || r.Nombre;
                const rLimite = r.limiteDiario || r.LimiteDiario || r.limite || 1;
                const rPopularidad = r.popularidad || r.Popularidad || 5;
                const rUrl = r.url || r.Url || r.URL;

                const hashHoy = `${nombreAl}_${rNombre}`;
                const intentos = datosDojo.intentosHoy || {};
                const realizados = intentos[hashHoy] || 0;
                const limiteAlcanzado = realizados >= rLimite;

                let estrellasStr = "";
                for(let s=0; s<5; s++) {
                    estrellasStr += s < rPopularidad ? "★" : "☆";
                }

                const card = document.createElement("div");
                card.className = "bg-[#1a1a1a] p-4 rounded border border-gray-800 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between text-xs text-gray-500 mb-1">
                            <span class="uppercase tracking-wider font-bold text-gray-400">${r.categoria || 'General'}</span>
                            <span class="mustard-text">${estrellasStr}</span>
                        </div>
                        <h3 class="font-bold text-sm text-white uppercase tracking-wide mb-1">${rNombre}</h3>
                        <p class="text-xs text-gray-400 mb-4">Completados hoy: ${realizados}/${rLimite}</p>
                    </div>
                    <div>
                        ${rUrl && rUrl !== "#" ? `
                            <a href="${rUrl}" target="_blank" class="block text-center text-xs bg-zinc-800 text-white py-1 rounded mb-2 hover:bg-zinc-700 transition-colors">
                                VER TUTORIAL
                            </a>
                        ` : ''}
                        <button 
                            onclick="marcarReto('${nombreAl}', '${rNombre}')"
                            ${limiteAlcanzado ? 'disabled class="w-full text-xs bg-zinc-900 text-zinc-600 py-1.5 rounded cursor-not-allowed"' : 'class="w-full text-xs mustard-bg text-black font-bold py-1.5 rounded hover:bg-yellow-600 transition-colors"'}
                        >
                            ${limiteAlcanzado ? 'LÍMITE ALCANZADO' : 'COMPLETADO'}
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        async function marcarReto(nombre, retoNombre) {
            if (!confirm(`¿Registrar reto "${retoNombre}"?`)) return;

            try {
                document.getElementById("main-container").style.opacity = "0.4";

                const data = {
                    nombreAlumno: nombre,
                    nombreReto: retoNombre,
                    puntos: 10,
                    edad: 0
                };

                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                alert("Reto enviado correctamente.");
                window.location.reload();
            } catch (e) {
                console.error(e);
                alert("Error al enviar el registro.");
                document.getElementById("main-container").style.opacity = "1";
            }
        }

        function construirGrafica() {
            const ctx = document.getElementById('chart-rendimiento').getContext('2d');
            const dash = datosDojo.dashboard || { actual: {}, anterior: {} };
            const actual = dash.actual || {};
            const anterior = dash.anterior || {};

            const alumnosSet = new Set([
                ...Object.keys(actual),
                ...Object.keys(anterior)
            ]);

            const labels = Array.from(alumnosSet).sort();
            const actualData = labels.map(a => actual[a] || 0);
            const anteriorData = labels.map(a => anterior[a] || 0);

            if(labels.length === 0) {
                labels.push("Sin registros");
                actualData.push(0);
                anteriorData.push(0);
            }

            if (graficoRendimiento) {
                graficoRendimiento.destroy();
            }

            graficoRendimiento = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Mes Actual',
                            data: actualData,
                            backgroundColor: '#e5a93c',
                            borderColor: '#e5a93c',
                            borderWidth: 1
                        },
                        {
                            label: 'Mes Anterior',
                            data: anteriorData,
                            backgroundColor: '#333333',
                            borderColor: '#444444',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#ffffff' }, grid: { color: '#111111' } },
                        y: { beginAtZero: true, ticks: { color: '#ffffff' }, grid: { color: '#111111' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#ffffff' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
