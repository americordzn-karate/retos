<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto del Mes - Senshi-Kan Karate Academy</title>
  <!-- Tailwind CSS para Estilos Rápidos y Limpios -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Chart.js para Renderizar la Gráfica de Rendimiento -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --color-gold: #D4AF37;
    }
    .gold-border-glow {
      border: 2px solid #D4AF37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }
  </style>
</head>
<body class="bg-black text-white font-sans min-h-screen">

  <!-- Encabezado Principal -->
  <header class="border-b border-zinc-800 bg-zinc-950 p-6 text-center">
    <h1 class="text-3xl font-extrabold uppercase tracking-wider text-amber-400">Senshi-Kan Karate Academy</h1>
    <p class="text-zinc-400 text-sm mt-1">Portal Oficial - Reto del Mes</p>
  </header>

  <!-- Contenedor de la Aplicación -->
  <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
    
    <!-- Sección de Mensaje de Carga / Estado -->
    <div id="estado-carga" class="text-center p-8 bg-zinc-900 rounded-lg border border-zinc-800">
      <p class="text-zinc-400 text-lg animate-pulse">Cargando datos del dojo y puntajes oficiales...</p>
    </div>

    <!-- Bloque de Dashboard (Oculto hasta que carguen los datos) -->
    <div id="contenido-portal" class="hidden space-y-8">
      
      <!-- Panel Superior: Gráfica de Rendimiento y Datos Biométricos -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Gráfica de Barras (Ocupa 2 columnas en pantallas grandes) -->
        <div class="lg:col-span-2 bg-zinc-900 p-6 rounded-lg border border-zinc-800">
          <h2 class="text-xl font-bold uppercase text-white mb-4 border-b border-zinc-800 pb-2">Tabla de Rendimiento Mensual</h2>
          <div class="relative w-full h-72">
            <canvas id="graficaPuntajes"></canvas>
          </div>
        </div>

        <!-- Visor Lateral: Datos de Alumnos Activos -->
        <div class="bg-zinc-900 p-6 rounded-lg border border-zinc-800 flex flex-col">
          <h2 class="text-xl font-bold uppercase text-amber-400 mb-4 border-b border-zinc-800 pb-2">Alumnos Registrados</h2>
          <div id="lista-alumnos" class="overflow-y-auto max-h-72 space-y-3 pr-2 flex-1">
            <!-- Los alumnos se inyectarán dinámicamente aquí -->
          </div>
        </div>

      </div>

      <!-- Sección Inferior: Módulos de Retos -->
      <div>
        <h2 class="text-2xl font-black uppercase text-white mb-6 tracking-wide">Retos Disponibles</h2>
        <div id="cuadrícula-retos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Las tarjetas de retos se inyectarán dinámicamente aquí -->
        </div>
      </div>

    </div>

  </main>

  <!-- Pie de Página -->
  <footer class="text-center p-6 text-zinc-600 text-xs mt-12 border-t border-zinc-900">
    &copy; 2026 Senshi-Kan Karate Academy &bull; Reynosa, Tamaulipas &bull; Datos de entrenamiento estructurados.
  </footer>

  <!-- LÓGICA DE CONTROL DEL PORTAL (JAVASCRIPT ORIGINAL INTEGRADO) -->
  <script>
    // Variables de Estado Global de la App
    let datosDojo = { alumnos: [], retos: [], dashboard: { actual: {} } };
    let miGrafica = null;

    // URL del Endpoint del Script del Dojo
    const SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT_AQUI";

    // Inicialización al cargar la ventana
    window.addEventListener('DOMContentLoaded', iniciarPortal);

    async function iniciarPortal() {
      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error("Error en la respuesta del servidor web.");
        
        // Recibe los datos completos sin alertas de depuración intrusivas
        datosDojo = await response.json();
        
        // Cambiar estados visuales en la interfaz
        document.getElementById('estado-carga').classList.add('hidden');
        document.getElementById('contenido-portal').classList.remove('hidden');

        // Construir los elementos con los datos limpios recibidos
        renderizarAlumnos();
        renderizarRetos();
        inicializarGrafica();

      } catch (error) {
        console.error("Fallo al inicializar portal:", error);
        document.getElementById('estado-carga').innerHTML = `
          <p class="text-red-500 font-bold">Error de conexión con la base de datos.</p>
          <p class="text-zinc-500 text-xs mt-2">${error.message}</p>
        `;
      }
    }

    // Inyección de Tarjetas de Alumnos con Estatura y Peso
    function renderizarAlumnos() {
      const contenedor = document.getElementById('lista-alumnos');
      contenedor.innerHTML = "";

      if (datosDojo.alumnos.length === 0) {
        contenedor.innerHTML = `<p class="text-zinc-500 text-sm">No hay alumnos activos registrados.</p>`;
        return;
      }

      datosDojo.alumnos.forEach(alumno => {
        const div = document.createElement('div');
        div.className = "p-3 bg-zinc-950 rounded border border-zinc-800 hover:border-amber-500 transition-colors";
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm text-zinc-200">${alumno.nombre}</span>
            <span class="text-xs bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded">ID: ${alumno.id}</span>
          </div>
          <div class="flex gap-4 mt-2 text-xs text-zinc-500">
            <span>Estatura: <strong class="text-zinc-300">${alumno.estatura}</strong></span>
            <span>Peso: <strong class="text-zinc-300">${alumno.peso}</strong></span>
          </div>
        `;
        contenedor.appendChild(div);
      });
    }

    // Inyección de Tarjetas de Retos en la Cuadrícula
    function renderizarRetos() {
      const contenedor = document.getElementById('cuadrícula-retos');
      contenedor.innerHTML = "";

      if (datosDojo.retos.length === 0) {
        contenedor.innerHTML = `<p class="text-zinc-500 col-span-full text-center py-8">No se encontraron retos asignados.</p>`;
        return;
      }

      datosDojo.retos.forEach(reto => {
        const tarjeta = document.createElement('div');
        tarjeta.className = "bg-zinc-900 border border-zinc-800 rounded-lg p-5 flex flex-col justify-between hover:scale-[1.02] transition-transform duration-200";
        tarjeta.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-white tracking-wide">${reto.nombre}</h3>
              <span class="text-xs px-2 py-1 rounded bg-amber-400/10 text-amber-400 font-medium uppercase">${reto.categoria}</span>
            </div>
            <p class="text-zinc-400 text-xs mt-1">Límite Diario: <span class="text-zinc-200">${reto.limiteDiario}</span></p>
          </div>
          <div class="mt-6 pt-4 border-t border-zinc-800/60 flex justify-between items-center">
            <span class="text-xs text-zinc-500">Popularidad: ${reto.popularidad || 0}★</span>
            <a href="${reto.url}" target="_blank" class="text-xs font-bold uppercase tracking-wider bg-white text-black px-4 py-2 rounded hover:bg-amber-400 hover:text-black transition-colors">Ver Guía</a>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    // Construcción de la Gráfica de Barras con Chart.js usando la Sumatoria Directa
    function inicializarGrafica() {
      const ctx = document.getElementById('graficaPuntajes').getContext('2d');
      
      // Mapeamos las llaves y valores directamente desde el objeto dashboard.actual
      const nombresAlumnos = Object.keys(datosDojo.dashboard.actual);
      const puntajesTotales = Object.values(datosDojo.dashboard.actual);

      if (miGrafica) {
        miGrafica.destroy();
      }

      miGrafica = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: nombresAlumnos.length > 0 ? nombresAlumnos : ["Sin Datos"],
          datasets: [{
            label: 'Puntos Acumulados',
            data: puntajesTotales.length > 0 ? puntajesTotales : [0],
            backgroundColor: '#D4AF37', // Color Oro Senshi-Kan
            borderColor: '#FFFFFF',
            borderWidth: 1,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#18181b',
              titleColor: '#fbbf24',
              bodyColor: '#ffffff',
              borderColor: '#27272a',
              borderWidth: 1
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: '#27272a' },
              ticks: { color: '#a1a1aa', font: { size: 11 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#a1a1aa', font: { size: 11, weight: 'bold' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
