<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Reto del Mes - Senshi-Kan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-brand-black { background-color: #1a1a1a; }
        .text-brand-gold { color: #d4af37; }
        .bg-brand-gold { background-color: #d4af37; }
        .border-brand-gold { border-color: #d4af37; }
        .sugerencias-lista { max-height: 200px; overflow-y: auto; z-index: 50; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <header class="bg-brand-black text-white py-6 shadow-md text-center border-b-4 border-brand-gold">
        <h1 class="text-3xl font-bold tracking-wider text-brand-gold text-center">RETO DEL MES</h1>
        <p class="text-gray-400 text-sm mt-1">Academia de Karate-Do</p>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-8">
        <section class="bg-white rounded-lg p-6 shadow-sm mb-8 border-t-4 border-brand-black">
            <h2 class="text-xl font-bold text-gray-800 mb-2 flex items-center gap-2">🥋 <span class="tracking-wide">IDENTIFICACIÓN DEL ALUMNO</span></h2>
            <input type="text" id="buscadorAlumno" autocomplete="off" placeholder="Busca tu nombre aquí..." class="w-full border-2 border-gray-300 rounded px-3 py-2">
            <div id="contenedorSugerencias" class="hidden absolute left-0 right-0 mt-1 bg-white border rounded shadow-lg sugerencias-lista"></div>
            <div id="alertaAlumno" class="hidden mt-4 bg-red-100 border text-red-700 px-4 py-3 rounded text-sm"></div>
        </section>
        <section id="panelBienvenida" class="hidden bg-brand-black text-white rounded-lg p-6 shadow-md mb-8 border-2 border-brand-gold">
            <h3 class="text-2xl font-bold text-brand-gold">¡Hola, <span id="txtNombreAlumno">---</span>!</h3>
        </section>
        <section id="seccionTablero" class="hidden bg-white rounded-lg p-6 shadow-sm mb-8 border-t-4 border-brand-gold">
            <h2 class="text-xl font-bold text-gray-800 mb-4">📊 TU RENDIMIENTO</h2>
            <div id="contenedorGrafica" class="space-y-3"></div>
        </section>
        <section id="seccionRetos" class="hidden mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 pb-2">🎯 RETOS DISPONIBLES</h2>
            <div id="contenedorRetos" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
    </main>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwk1sf4B--H1WxEnRsmdjBKZgiqM1pFvcHoyb1Tni9-MZ81M7NRM28YfPU8FEHO7KG4KA/exec";
        let baseDatosAlumnos = [], baseDatosRetos = [], datosDashboard = { actual: {}, anterior: {} }, intentosHoy = {};

        async function inicializarPortal() {
            const res = await fetch(WEB_APP_URL);
            const datos = await res.json();
            baseDatosAlumnos = datos.alumnos; baseDatosRetos = datos.retos; 
            datosDashboard = datos.dashboard; intentosHoy = datos.intentosHoy;
            verificarSesionExistente();
        }

        // Esta es la única función que necesitaba el ajuste para leer 'limiteDiario'
        function construirTarjetasRetos(nombreAlumno, fechaNacimiento) {
            contenedorRetos.innerHTML = "";
            baseDatosRetos.forEach(reto => {
                const hashClave = `${nombreAlumno}_${reto.nombre}`;
                const realizadosHoy = intentosHoy[hashClave] || 0;
                
                // Aquí llamamos exactamente a la variable 'limiteDiario' que definiste en el Script.txt 
                const limiteMaximo = parseInt(reto.limiteDiario) || 999;
                
                const botonHTML = realizadosHoy >= limiteMaximo 
                    ? `<button disabled class="w-full bg-gray-300 text-gray-500 font-bold py-3 rounded uppercase text-xs">Límite alcanzado</button>`
                    : `<a href="${reto.url}" class="block text-center bg-brand-black text-brand-gold font-bold py-3 rounded">INICIAR RETO</a>`;

                const tarjeta = document.createElement("div");
                tarjeta.className = "bg-white border-2 p-5 rounded-lg";
                tarjeta.innerHTML = `
                    <h4 class="text-xl font-bold">${reto.nombre}</h4>
                    <p class="text-xs text-neutral-500 my-2">Intentos: ${realizadosHoy} / ${limiteMaximo === 999 ? '∞' : limiteMaximo}</p>
                    ${botonHTML}
                `;
                contenedorRetos.appendChild(tarjeta);
            });
        }
        
        window.addEventListener("DOMContentLoaded", inicializarPortal);
        // ... (resto de tus funciones originales)
    </script>
</body>
</html>
